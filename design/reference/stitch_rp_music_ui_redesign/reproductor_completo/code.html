<script>
  (function initPlayerDelights() {
    // Interactive Play / Pause Micro-Interaction
    const playPauseBtn = document.getElementById('btn-play-pause');
    const playPauseIcon = document.getElementById('play-pause-icon');
    let isPlaying = true;

    if (playPauseBtn && playPauseIcon) {
      playPauseBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playPauseIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
        playPauseIcon.style.transform = isPlaying ? 'translateX(0)' : 'translateX(2px)';
      });
    }

    // Favorite Toggle with Delight Scale Bounce
    const favBtn = document.getElementById('btn-fav');
    const favIcon = document.getElementById('fav-icon');
    let isFav = true;

    if (favBtn && favIcon) {
      favBtn.addEventListener('click', () => {
        isFav = !isFav;
        if (isFav) {
          favIcon.style.fontVariationSettings = "'FILL' 1";
          favIcon.classList.remove('text-outline');
          favIcon.classList.add('text-primary');
        } else {
          favIcon.style.fontVariationSettings = "'FILL' 0";
          favIcon.classList.remove('text-primary');
          favIcon.classList.add('text-outline');
        }
      });
    }

    // Repeat Mode Tri-State Switcher
    const repeatBtn = document.getElementById('btn-repeat');
    let repeatState = 0; // 0: Off, 1: Repeat All, 2: Repeat One
    if (repeatBtn) {
      repeatBtn.addEventListener('click', () => {
        repeatState = (repeatState + 1) % 3;
        const iconSpan = repeatBtn.querySelector('.material-symbols-outlined');
        const dotSpan = repeatBtn.querySelector('span:last-child');
        
        if (repeatState === 0) {
          repeatBtn.classList.remove('text-primary');
          repeatBtn.classList.add('text-on-surface-variant');
          iconSpan.textContent = 'repeat';
          dotSpan.classList.remove('bg-primary');
          dotSpan.classList.add('bg-transparent');
        } else if (repeatState === 1) {
          repeatBtn.classList.add('text-primary');
          repeatBtn.classList.remove('text-on-surface-variant');
          iconSpan.textContent = 'repeat';
          dotSpan.classList.add('bg-primary');
          dotSpan.classList.remove('bg-transparent');
        } else {
          repeatBtn.classList.add('text-primary');
          repeatBtn.classList.remove('text-on-surface-variant');
          iconSpan.textContent = 'repeat_one';
          dotSpan.classList.add('bg-primary');
          dotSpan.classList.remove('bg-transparent');
        }
      });
    }

    // Scrubber click interaction demo
    const scrubberContainer = document.getElementById('scrubber-container');
    const scrubProgress = document.getElementById('scrub-progress');
    const scrubThumb = document.getElementById('scrub-thumb');
    const timeElapsed = document.getElementById('time-elapsed');

    if (scrubberContainer && scrubProgress && scrubThumb && timeElapsed) {
      scrubberContainer.addEventListener('click', (e) => {
        const rect = scrubberContainer.getBoundingClientRect();
        const clickX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
        const percentage = (clickX / rect.width) * 100;
        
        scrubProgress.style.width = percentage + '%';
        scrubThumb.style.left = percentage + '%';

        // Calculate time roughly based on 258 total seconds (4:18)
        const currentSecs = Math.floor((percentage / 100) * 258);
        const mins = Math.floor(currentSecs / 60);
        const secs = String(currentSecs % 60).padStart(2, '0');
        timeElapsed.textContent = `${mins}:${secs}`;
      });
    }
  })();
