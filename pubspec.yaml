name: rp_music
description: Reproductor local extensible para Android y Windows.
publish_to: none
version: 0.3.9+18
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  crypto: ^3.0.7
  audio_session: ^0.2.4
  audio_service: ^0.18.19
  path_provider: ^2.1.6
  path: ^1.9.1
  file_picker: ^13.1.0
  audio_metadata_reader: ^1.8.1
  just_audio_windows_plus: 0.5.5
  dart_eval: 0.8.5
  analyzer: 8.4.1
  flutter_qjs_next: 1.5.2
dependency_overrides:
  audio_service:
    path: third_party/audio_service

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/rp-music-variant-a.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
