name: rp_music
description: "A local-first cross-platform music player for Windows, Android, and Web."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  just_audio: ^0.10.6
  just_audio_windows: ^0.2.3
  just_audio_web: ^0.4.16
  audio_session: ^0.2.4
  audio_service: ^0.18.19
  drift: ^2.35.2
  sqlite3: ^3.7.1
  path_provider: ^2.1.6
  path: ^1.9.1
  file_picker: ^13.1.0
  uuid: ^4.6.0
  intl: ^0.20.3
  audio_metadata_reader: ^1.8.1
  web: ^1.1.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
